name: Rename uploaded file to index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename pakzameen-index.html to index.html
        run: |
          git config user.name "DrSAhmad"
          git config user.email "DrSAhmad@users.noreply.github.com"
          mv -f pakzameen-index.html index.html
          git add -A
          git commit -m "Rename pakzameen-index.html to index.html"
          git push
