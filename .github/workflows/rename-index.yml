name: rename-index
on: workflow_dispatch
jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          git mv -f pakzameen-index.html index.html
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git commit -m "Rename staged index to index.html"
          git push
