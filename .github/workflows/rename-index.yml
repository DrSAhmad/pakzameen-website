name: Rename index
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-index.yml'
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git mv -f pakzameen-index.html index.html
          git commit -m "Rename pakzameen-index.html to index.html"
          git push
